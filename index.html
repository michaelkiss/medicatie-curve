<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Medicatie Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6750a4;
    --on-primary: #ffffff;
    --surface: #fffbfe;
    --surface-variant: #e7e0ec;
    --card: #ffffff;
    --text: #1d1b20;
    --muted: #49454f;
    --outline: #cac4d0;
    --good: #2e7d32;
    --warn: #ed6c02;
    --bad: #b3261e;
    --med: #6750a4;
    --rit: #0061a4;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #141218;
      --surface-variant: #49454f;
      --card: #211f26;
      --text: #e6e0e9;
      --muted: #cac4d0;
      --outline: #938f99;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
      font-family: 'Roboto', -apple-system, sans-serif; }
  body { background: var(--surface); color: var(--text); min-height: 100vh; padding-bottom: 110px; }
  .topbar { padding: 16px 20px 4px; }
  .headline { font-size: 28px; font-weight: 700; letter-spacing: 0; }
  .subhead { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .section { font-size: 14px; font-weight: 500; color: var(--primary); padding: 20px 20px 8px; letter-spacing: .3px; }
  .card { background: var(--card); margin: 0 16px; border-radius: var(--radius); overflow: hidden;
          box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { .card { box-shadow: 0 1px 3px rgba(0,0,0,.5); } }
  .row-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--outline); min-height: 56px; }
  .row-item:last-child { border-bottom: none; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .grow { flex: 1; min-width: 0; }
  .t { font-size: 16px; font-weight: 500; }
  .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .del { color: var(--bad); border: none; background: none; font-size: 20px; padding: 6px; border-radius: 50%; }
  .del:active { background: var(--surface-variant); }
  .empty { color: var(--muted); font-size: 14px; padding: 16px; text-align: center; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; }
  .stat-cell { padding: 16px; border-bottom: 1px solid var(--outline); }
  .stat-cell:nth-child(odd) { border-right: 1px solid var(--outline); }
  .stat-cell:nth-child(n+3) { border-bottom: none; }
  .stat-k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat-v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  svg { width: 100%; height: auto; display: block; padding: 8px 0 4px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 4px 16px 14px; }
  .legend span::before { content: "—"; margin-right: 4px; font-weight: 700; }
  #fab { position: fixed; bottom: 24px; right: 20px; width: 60px; height: 60px; border-radius: 18px;
         background: var(--primary); color: var(--on-primary); border: none; font-size: 26px; cursor: pointer;
         box-shadow: 0 6px 16px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
  #fab:active { filter: brightness(1.1); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-bg.open { display: flex; }
  .sheet { background: var(--surface); border-radius: 28px 28px 0 0; width: 100%; max-width: 600px;
           padding: 10px 0 calc(24px + env(safe-area-inset-bottom)); animation: slideup .28s cubic-bezier(.4,0,.2,1); }
  @keyframes slideup { from { transform: translateY(100%);} to { transform: translateY(0);} }
  .grabber { width: 32px; height: 4px; border-radius: 2px; background: var(--muted); opacity: .5; margin: 4px auto 12px; }
  .sheet-title { font-size: 22px; font-weight: 700; padding: 0 24px 14px; }
  .sheet-body { padding: 0 20px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--card); color: var(--text);
         border: 1px solid var(--outline); border-radius: var(--radius); padding: 15px 16px; font-size: 16px;
         font-weight: 500; cursor: pointer; margin-bottom: 10px; text-align: left; }
  .opt:active { background: var(--surface-variant); }
  .opt.sel { border: 2px solid var(--primary); }
  .btn-primary { width: 100%; background: var(--primary); color: var(--on-primary); border: none; border-radius: 999px;
                 padding: 15px; font-size: 15px; font-weight: 500; letter-spacing: .4px; cursor: pointer; margin-top: 10px; }
  .btn-text { width: 100%; background: transparent; color: var(--primary); border: none; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer; }
  .time-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--outline); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
  .time-row label { font-size: 15px; color: var(--muted); flex: 1; }
  input[type="time"] { border: none; background: transparent; font-size: 16px; color: var(--primary); font-weight: 500; font-family: 'Roboto', sans-serif; }
  .note { font-size: 13px; color: var(--muted); padding: 2px 4px 10px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="headline">💊 Medicatie</div>
  <div class="subhead">Indicatieve curve van methylfenidaat</div>
</div>

<div class="section">Ingenomen vandaag</div>
<div class="card" id="intakes"></div>

<div id="results" class="hidden">
  <div class="section">Schatting</div>
  <div class="card stats">
    <div class="stat-cell"><div class="stat-k">Piek(en)</div><div class="stat-v" id="st-peak">–</div></div>
    <div class="stat-cell"><div class="stat-k">Uitgewerkt om</div><div class="stat-v" id="st-end">–</div></div>
  </div>
  <div class="section">Curve</div>
  <div class="card">
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="section">Geschiedenis</div>
<div id="history"></div>

<button id="fab" onclick="openModal()">+</button>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-title" id="m-title">Welke medicatie?</div>
    <div class="sheet-body" id="m-body"></div>
  </div>
</div>

<script>
const KE = Math.LN2 / 2.5;
const KA_FAST = 1.3, KA_FED = 0.65, FED_SCALE = 0.85;
const DELAY_RETARD = 3.5, DELAY_RETARD_FED = 4.0;
const WORN_OFF_FRAC = 0.10;
const CLINICAL_DUR = { medikinet: 7 * 60, ritalin: 3.5 * 60 };
const MEDS = {
  medikinet: { name: "Medikinet Retard 10 mg", icon: "💊", hex: "#6750a4", bg: "#eaddff" },
  ritalin:   { name: "Ritalin 10 mg",            icon: "💉", hex: "#0061a4", bg: "#d0e4ff" },
};

function bateman(t, ka) { if (t <= 0) return 0; return Math.exp(-KE*t) - Math.exp(-ka*t); }
function intakeCurve(ik, tMin) {
  const dt = tMin - ik.tMin;
  const ka = ik.fed ? KA_FED : KA_FAST;
  const s = ik.fed ? FED_SCALE : 1;
  if (ik.type === "ritalin") return s * bateman(dt/60, ka);
  const d = ik.fed ? DELAY_RETARD_FED : DELAY_RETARD;
  return 0.5*s*bateman(dt/60, ka) + 0.5*s*bateman(dt/60 - d, ka);
}
function todayKey() { return new Date().toISOString().slice(0,10); }
function loadLog() {
  try {
    const raw = JSON.parse(localStorage.getItem("medcurve") || "{}");
    const log = raw.log || {};
    if (raw.date && Array.isArray(raw.intakes)) (log[raw.date] = log[raw.date] || []).push(...raw.intakes);
    return log;
  } catch { return {}; }
}
function saveLog(log) { localStorage.setItem("medcurve", JSON.stringify({ log })); }
let log = loadLog();
if (!log[todayKey()]) log[todayKey()] = [];
let intakes = log[todayKey()];

function timeStr(m) {
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
}

let step = 0, sel = { type: null, tMin: null, fed: false };
function openModal() { step = 0; sel = { type: null, tMin: null, fed: false }; renderStep(); document.getElementById("modal-bg").classList.add("open"); }
function closeModal() { document.getElementById("modal-bg").classList.remove("open"); }

function renderStep() {
  const title = document.getElementById("m-title"), body = document.getElementById("m-body");
  if (step === 0) {
    title.textContent = "Welke medicatie?";
    body.innerHTML = Object.entries(MEDS).map(([k, m]) =>
      `<button class="opt ${sel.type===k?'sel':''}" onclick="sel.type='${k}';step=1;renderStep()">
        <span class="avatar" style="background:${m.bg};color:${m.hex}">${m.icon}</span><span>${m.name}</span></button>`).join("") +
      `<button class="btn-text" onclick="closeModal()">Annuleren</button>`;
  } else if (step === 1) {
    const m = MEDS[sel.type];
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    if (sel.tMin === null) sel.tMin = nowMin;
    const nowStr = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    title.textContent = m.name;
    body.innerHTML = `
      <button class="opt ${sel.tMin===nowMin?'sel':''}" onclick="sel.tMin=${nowMin};renderStep()"><span class="avatar" style="background:${m.bg};color:${m.hex}">⏱️</span><span>Nu (${nowStr})</span></button>
      <div class="time-row"><label>Eerder vandaag om</label>
        <input type="time" value="${timeStr(sel.tMin)}" onchange="const p=this.value.split(':').map(Number);sel.tMin=p[0]*60+p[1];">
      </div>
      <button class="btn-primary" onclick="step=2;renderStep()">Doorgaan</button>
      <button class="btn-text" onclick="step=0;renderStep()">Terug</button>`;
  } else {
    title.textContent = "Gegeten bij inname?";
    body.innerHTML = `
      <button class="opt ${sel.fed?'sel':''}" onclick="sel.fed=true;renderStep()"><span class="avatar" style="background:#e8f5e9;color:#2e7d32">🍽️</span><span>Ja, ik heb gegeten</span></button>
      <button class="opt ${!sel.fed?'sel':''}" onclick="sel.fed=false;renderStep()"><span class="avatar" style="background:#eceff1;color:#546e7a">🚫</span><span>Nee, op lege maag</span></button>
      <p class="note">Voedsel vertraagt de opname: piek iets later en lager.</p>
      <button class="btn-primary" onclick="addIntake()">Opslaan</button>
      <button class="btn-text" onclick="step=1;renderStep()">Terug</button>`;
  }
}

function addIntake() {
  intakes.push({ id: Date.now()+Math.random().toString(36).slice(2,6), type: sel.type, tMin: sel.tMin, fed: sel.fed });
  intakes.sort((a,b) => a.tMin - b.tMin);
  log[todayKey()] = intakes;
  saveLog(log);
  closeModal();
  renderAll();
}
function removeIntake(id) {
  intakes = intakes.filter(i => i.id !== id);
  if (intakes.length) log[todayKey()] = intakes; else delete log[todayKey()];
  saveLog(log);
  renderAll();
}

function renderAll() {
  renderHistory();
  const box = document.getElementById("intakes");
  box.innerHTML = intakes.length ? intakes.map(ik => {
    const m = MEDS[ik.type];
    return `<div class="row-item">
      <span class="avatar" style="background:${m.bg};color:${m.hex}">${m.icon}</span>
      <div class="grow"><div class="t">${m.name}</div>
      <div class="d">${timeStr(ik.tMin)} · ${ik.fed ? "🍽️ gegeten" : "op lege maag"}</div></div>
      <button class="del" onclick="removeIntake('${ik.id}')">✕</button>
    </div>`;
  }).join("") : '<div class="empty">Nog geen inname vandaag</div>';

  if (!intakes.length) { document.getElementById("results").classList.add("hidden"); return; }
  document.getElementById("results").classList.remove("hidden");

  const first = Math.min(...intakes.map(i=>i.tMin));
  const last = Math.max(...intakes.map(i=>i.tMin));
  const t0 = first - 30, t1 = last + 12*60, N = 720;
  const total = [], per = intakes.map(ik => []);
  for (let i = 0; i <= N; i++) {
    const t = t0 + (t1-t0)*i/N;
    let sum = 0;
    per.forEach((arr, j) => { const c = intakeCurve(intakes[j], t); arr.push({t, c}); sum += c; });
    total.push({t, c: sum});
  }
  const max = Math.max(...total.map(v=>v.c));
  const thresh = WORN_OFF_FRAC * max;
  const peakInfo = per.map(arr => { let p = arr[0]; for (let i=1;i<arr.length;i++) if (arr[i].c>p.c) p=arr[i]; return {t:p.t,c:p.c}; });
  let gp = total[0]; total.forEach(v => { if (v.c > gp.c) gp = v; });
  let endT = null;
  for (let i = 0; i < total.length; i++) if (total[i].t > gp.t && total[i].c < thresh) { endT = total[i].t; break; }
  if (endT === null) endT = t1;
  const clinEnd = Math.max(...intakes.map(i => i.tMin + CLINICAL_DUR[i.type]));

  document.getElementById("st-peak").textContent = peakInfo.map(p => timeStr(p.t)).join(" · ");
  document.getElementById("st-end").textContent = timeStr(clinEnd) + " / " + timeStr(endT);

  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const gridC = isDark ? "#49454f" : "#e0e0e0";
  const lblC = "#79747e";
  const totC = isDark ? "#e6e0e9" : "#1d1b20";

  const W = 700, H = 240, padL = 40, padR = 12, padT = 16, padB = 28;
  const x = t => padL + (t - t0)/(t1 - t0) * (W - padL - padR);
  const y = c => H - padB - (c/max) * (H - padT - padB);
  let grid = "";
  for (let t = Math.ceil(t0/60)*60; t <= t1; t += 60)
    grid += `<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${H-padB}" stroke="${gridC}"/>
             <text x="${x(t)}" y="${H-8}" fill="${lblC}" font-size="10" text-anchor="middle" font-family="Roboto">${timeStr(t)}</text>`;
  let paths = "";
  per.forEach((arr, j) => {
    const m = MEDS[intakes[j].type];
    const d = arr.map((v,i) => (i?"L":"M") + x(v.t).toFixed(1) + "," + y(v.c).toFixed(1)).join(" ");
    paths += `<path d="${d}" fill="none" stroke="${m.hex}" stroke-width="2.5"/>`;
    const p = peakInfo[j];
    paths += `<circle cx="${x(p.t)}" cy="${y(p.c)}" r="5" fill="${m.hex}"/>
             <text x="${x(p.t)}" y="${y(p.c)-10}" fill="${m.hex}" font-size="11" text-anchor="middle" font-family="Roboto">${timeStr(p.t)}</text>`;
  });
  const dTot = total.map((v,i) => (i?"L":"M") + x(v.t).toFixed(1) + "," + y(v.c).toFixed(1)).join(" ");
  const now = new Date(); const nowMin = now.getHours()*60 + now.getMinutes();
  const nowLine = (t0 <= nowMin && nowMin <= t1)
    ? `<line x1="${x(nowMin)}" y1="${padT}" x2="${x(nowMin)}" y2="${H-padB}" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,4"/>
       <text x="${x(nowMin)}" y="${padT+12}" fill="#2e7d32" font-size="11" text-anchor="middle" font-family="Roboto">nu</text>` : "";
  const endMark = `<line x1="${x(endT)}" y1="${padT}" x2="${x(endT)}" y2="${H-padB}" stroke="#b3261e" stroke-width="2" stroke-dasharray="3,4"/>
     <text x="${x(endT)}" y="${H-8}" fill="#b3261e" font-size="10" text-anchor="middle" font-family="Roboto">${timeStr(endT)}</text>`;
  const clinMark = clinEnd <= t1 ? `<line x1="${x(clinEnd)}" y1="${padT}" x2="${x(clinEnd)}" y2="${H-padB}" stroke="#ed6c02" stroke-width="2" stroke-dasharray="2,3"/>
     <text x="${x(clinEnd)}" y="${padT+24}" fill="#ed6c02" font-size="10" text-anchor="middle" font-family="Roboto">${timeStr(clinEnd)}</text>` : "";

  document.getElementById("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${grid}
      <path d="${dTot}" fill="none" stroke="${totC}" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
      ${paths}${nowLine}${endMark}${clinMark}
    </svg>`;
  document.getElementById("legend").innerHTML =
    intakes.map(ik => `<span style="color:${MEDS[ik.type].hex}">${MEDS[ik.type].icon} ${timeStr(ik.tMin)}</span>`).join("") +
    `<span style="color:${totC}">totaal</span><span style="color:#2e7d32">nu</span><span style="color:#ed6c02">klinisch</span><span style="color:#b3261e">plasma &lt;10%</span>`;
}

function fmtDay(key) {
  const d = new Date(key + "T00:00:00");
  if (key === todayKey()) return "Vandaag";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === y.toISOString().slice(0,10)) return "Gisteren";
  return d.toLocaleDateString("nl-BE", { weekday: "short", day: "numeric", month: "short" });
}
function renderHistory() {
  const box = document.getElementById("history");
  if (!box) return;
  const days = Object.keys(log).filter(k => log[k] && log[k].length).sort().reverse();
  box.innerHTML = days.length ? days.map(k => `
    <div class="section" style="padding-top:6px">${fmtDay(k)}</div>
    <div class="card">
      ${[...log[k]].sort((a,b)=>b.tMin-a.tMin).map(ik => {
        const m = MEDS[ik.type];
        return `<div class="row-item">
          <span class="avatar" style="background:${m.bg};color:${m.hex}">${m.icon}</span>
          <div class="grow"><div class="t">${m.name}</div>
          <div class="d">${timeStr(ik.tMin)} · ${ik.fed ? "🍽️ gegeten" : "op lege maag"}</div></div>
        </div>`;
      }).join("")}
    </div>`).join("") : '<div class="card"><div class="empty">Nog geen geschiedenis</div></div>';
}

renderAll();
</script>
</body>
</html>
